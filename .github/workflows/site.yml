name: Website

# Builds visona.org from site/ and the GitHub releases, and deploys it to GitHub Pages.
# A published release fires before the Release workflow has uploaded its files, so the site is
# also rebuilt when that workflow finishes. Releases without files are skipped by site/build.py.
on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/images/**
      - .github/workflows/site.yml
  release:
    types: [published, edited, deleted, released, prereleased, unpublished]
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Build site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 site/build.py --out _site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
