name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux core (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    env:
      PRESET: core-${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          cmake --version
          ninja --version
          g++ --version
          clang++ --version

      - name: Configure
        run: cmake --preset "$PRESET"

      - name: Build
        run: cmake --build --preset "$PRESET"

      - name: Test
        run: ctest --preset "$PRESET"

      - name: Check that JUCE was not fetched
        run: |
          if compgen -G "build/$PRESET/_deps/juce*" > /dev/null; then
            echo "::error::JUCE was downloaded in a core-only build"
            exit 1
          fi

  sanitizers:
    name: Linux core (${{ matrix.sanitizers }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - sanitizers: ASan + UBSan
            preset: core-sanitize
          - sanitizers: TSan
            preset: core-tsan
    env:
      PRESET: ${{ matrix.preset }}
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          cmake --version
          ninja --version
          clang++ --version

      - name: Configure
        run: cmake --preset "$PRESET"

      - name: Build
        run: cmake --build --preset "$PRESET"

      - name: Test
        run: ctest --preset "$PRESET"
