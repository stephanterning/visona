name: Pi quick build

# Builds only the Raspberry Pi app from the branch chosen, without tests, as fast as the runner
# allows, and publishes it to the Development builds prerelease under the same name as the
# Release workflow's Pi build, so install-visona.sh takes either URL.
on:
  workflow_dispatch:
  push:
    branches: [cursor/fast-pi-build-ce94]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  pi:
    name: Linux arm64 app (Pi), quick
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPRESS: "true"
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config ccache \
            libasound2-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxcomposite-dev libxi-dev libgl1-mesa-dev

      - uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-pi-quick-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-pi-quick-${{ github.ref_name }}-
            ccache-pi-quick-

      - name: Configure
        run: cmake --preset pi-quick

      - name: Build
        run: |
          cmake --build --preset pi-quick
          ccache --show-stats

      - name: Package Pi binary and kiosk scripts
        run: |
          mkdir -p dist
          tar czf dist/Visona-linux-arm64-pi.tar.gz \
            -C build/pi-quick/app/Visona_artefacts/Release Visona \
            -C "$GITHUB_WORKSPACE" scripts/pi docs/pi-kiosk.md docs/pi-build.md docs/pi-setup.md

      - name: Publish
        uses: ./.github/actions/publish
