name: Release

# A published release builds everything and attaches it to the release. A manual run builds only
# the artifacts ticked, from the branch chosen, and publishes them to the Development builds
# prerelease (D-104).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      macos_app:
        description: macOS app
        type: boolean
        default: false
      macos_vst3:
        description: macOS VST3 plugins
        type: boolean
        default: false
      macos_au:
        description: macOS AU plugins
        type: boolean
        default: false
      macos_clap:
        description: macOS CLAP plugins
        type: boolean
        default: false
      windows_vst3:
        description: Windows VST3 plugins
        type: boolean
        default: false
      windows_clap:
        description: Windows CLAP plugins
        type: boolean
        default: false
      linux_vst3:
        description: Linux VST3 plugins
        type: boolean
        default: false
      linux_clap:
        description: Linux CLAP plugins
        type: boolean
        default: false
      pi_app:
        description: Raspberry Pi app
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  macos:
    name: macOS arm64 app and plugins
    if: github.event_name == 'release' || inputs.macos_app || inputs.macos_vst3 || inputs.macos_au || inputs.macos_clap
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      APP_BUNDLE: build/macos/app/Visona_artefacts/Release/Visona.app
      VISONA_ARTEFACTS: build/macos/plugin/VisonaPlugin_artefacts/Release
      SYNC_ARTEFACTS: build/macos/plugin/VisonaSyncPlugin_artefacts/Release
      CLAP_VALIDATOR_URL: https://github.com/free-audio/clap-validator/releases/download/0.4.1/clap-validator-0.4.1-127-g152b982-macos-15-aarch64.zip
      BUILD_APP: ${{ github.event_name == 'release' || inputs.macos_app }}
      BUILD_VST3: ${{ github.event_name == 'release' || inputs.macos_vst3 }}
      BUILD_AU: ${{ github.event_name == 'release' || inputs.macos_au }}
      BUILD_CLAP: ${{ github.event_name == 'release' || inputs.macos_clap }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake --preset macos

      - name: Build
        run: |
          targets=(visona_core_tests)
          if [[ "$BUILD_APP" == true ]]; then targets+=(Visona); fi
          for format in VST3 AU CLAP; do
            enabled="BUILD_$format"
            if [[ "${!enabled}" == true ]]; then
              targets+=("VisonaPlugin_$format" "VisonaSyncPlugin_$format")
            fi
          done
          cmake --build --preset macos --target "${targets[@]}"

      - name: Test
        run: ctest --preset macos

      - name: Check app bundle
        if: env.BUILD_APP == 'true'
        run: |
          executable="$APP_BUNDLE/Contents/MacOS/Visona"
          test "$(lipo -archs "$executable")" = "arm64"
          vtool -show-build "$executable" | grep -E '^ +minos 14\.0$'
          codesign --verify --strict --verbose=2 "$APP_BUNDLE"
          plist="$APP_BUNDLE/Contents/Info.plist"
          test "$(plutil -extract CFBundleIdentifier raw "$plist")" = "io.github.stephanterning.visona"
          plutil -extract NSMicrophoneUsageDescription raw "$plist"

      - name: Package app
        if: env.BUILD_APP == 'true'
        run: |
          mkdir -p dist
          ditto -c -k --keepParent "$APP_BUNDLE" dist/Visona-macos-arm64.zip

      - name: Sign plugin bundles
        if: env.BUILD_VST3 == 'true' || env.BUILD_AU == 'true' || env.BUILD_CLAP == 'true'
        run: |
          bundles=()
          if [[ "$BUILD_VST3" == true ]]; then
            bundles+=("$VISONA_ARTEFACTS/VST3/Visona.vst3" "$SYNC_ARTEFACTS/VST3/Visona Sync.vst3")
          fi
          if [[ "$BUILD_AU" == true ]]; then
            bundles+=("$VISONA_ARTEFACTS/AU/Visona.component" "$SYNC_ARTEFACTS/AU/Visona Sync.component")
          fi
          if [[ "$BUILD_CLAP" == true ]]; then
            bundles+=("$VISONA_ARTEFACTS/CLAP/Visona.clap" "$SYNC_ARTEFACTS/CLAP/Visona Sync.clap")
          fi
          for bundle in "${bundles[@]}"; do
            test -d "$bundle"
            test "$(lipo -archs "$bundle/Contents/MacOS/$(basename "${bundle%.*}")")" = "arm64"
            codesign --force --sign - --timestamp=none --deep "$bundle"
            codesign --verify --strict --verbose=2 "$bundle"
          done

      - name: Validate AU plugins
        if: env.BUILD_AU == 'true'
        run: |
          components="$HOME/Library/Audio/Plug-Ins/Components"
          mkdir -p "$components"
          rm -rf "$components/Visona.component" "$components/Visona Sync.component"
          cp -R "$VISONA_ARTEFACTS/AU/Visona.component" "$SYNC_ARTEFACTS/AU/Visona Sync.component" "$components/"
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -a | grep -E 'Ster'
          auval -strict -v aufx Visn Ster
          auval -strict -v aumu Sync Ster

      - name: Validate CLAP plugins
        if: env.BUILD_CLAP == 'true'
        run: |
          curl -fsSL -o clap-validator.zip "$CLAP_VALIDATOR_URL"
          mkdir clap-validator
          ditto -x -k clap-validator.zip clap-validator
          find clap-validator -name '*.tar.gz' -exec tar -xzf {} -C clap-validator \;
          validator="$(find clap-validator -type f -name clap-validator -perm -u+x | head -n 1)"
          test -n "$validator"
          # param-conversions divides by zero in the validator itself for plugins without parameters.
          "$validator" validate --exclude '^param-conversions$' \
            "$VISONA_ARTEFACTS/CLAP/Visona.clap" "$SYNC_ARTEFACTS/CLAP/Visona Sync.clap"

      - name: Package plugins
        if: env.BUILD_VST3 == 'true' || env.BUILD_AU == 'true' || env.BUILD_CLAP == 'true'
        run: |
          mkdir -p dist
          if [[ "$BUILD_VST3" == true ]]; then
            ditto -c -k --keepParent "$VISONA_ARTEFACTS/VST3/Visona.vst3" dist/Visona-vst3-macos-arm64.zip
            ditto -c -k --keepParent "$SYNC_ARTEFACTS/VST3/Visona Sync.vst3" dist/Visona-sync-vst3-macos-arm64.zip
          fi
          if [[ "$BUILD_AU" == true ]]; then
            ditto -c -k --keepParent "$VISONA_ARTEFACTS/AU/Visona.component" dist/Visona-au-macos-arm64.zip
            ditto -c -k --keepParent "$SYNC_ARTEFACTS/AU/Visona Sync.component" dist/Visona-sync-au-macos-arm64.zip
          fi
          if [[ "$BUILD_CLAP" == true ]]; then
            ditto -c -k --keepParent "$VISONA_ARTEFACTS/CLAP/Visona.clap" dist/Visona-clap-macos-arm64.zip
            ditto -c -k --keepParent "$SYNC_ARTEFACTS/CLAP/Visona Sync.clap" dist/Visona-sync-clap-macos-arm64.zip
          fi

      - name: Publish
        uses: ./.github/actions/publish

  linux-x64-plugins:
    name: Linux x86_64 plugins
    if: github.event_name == 'release' || inputs.linux_vst3 || inputs.linux_clap
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VISONA_ARTEFACTS: build/linux-plugin/plugin/VisonaPlugin_artefacts/Release
      SYNC_ARTEFACTS: build/linux-plugin/plugin/VisonaSyncPlugin_artefacts/Release
      CLAP_VALIDATOR_URL: https://github.com/free-audio/clap-validator/releases/download/0.4.1/clap-validator-0.4.1-127-g152b982-ubuntu-22.04.zip
      PLUGINVAL_URL: https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Linux.zip
      BUILD_VST3: ${{ github.event_name == 'release' || inputs.linux_vst3 }}
      BUILD_CLAP: ${{ github.event_name == 'release' || inputs.linux_clap }}
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential cmake ninja-build pkg-config xvfb \
            libasound2-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxcomposite-dev libxi-dev libgl1-mesa-dev

      - name: Configure
        run: cmake --preset linux-plugin

      - name: Build
        run: |
          targets=(visona_core_tests)
          for format in VST3 CLAP; do
            enabled="BUILD_$format"
            if [[ "${!enabled}" == true ]]; then
              targets+=("VisonaPlugin_$format" "VisonaSyncPlugin_$format")
            fi
          done
          cmake --build --preset linux-plugin --target "${targets[@]}"

      - name: Test
        run: ctest --preset linux-plugin

      - name: Validate VST3 plugins
        if: env.BUILD_VST3 == 'true'
        run: |
          curl -fsSL -o pluginval.zip "$PLUGINVAL_URL"
          unzip -q pluginval.zip -d pluginval
          chmod +x pluginval/pluginval
          for bundle in "$VISONA_ARTEFACTS/VST3/Visona.vst3" "$SYNC_ARTEFACTS/VST3/Visona Sync.vst3"; do
            xvfb-run -a pluginval/pluginval --strictness-level 5 --skip-gui-tests --validate-in-process --validate "$bundle"
          done

      - name: Validate CLAP plugins
        if: env.BUILD_CLAP == 'true'
        run: |
          curl -fsSL -o clap-validator.zip "$CLAP_VALIDATOR_URL"
          unzip -q clap-validator.zip -d clap-validator
          find clap-validator -name '*.tar.gz' -exec tar -xzf {} -C clap-validator \;
          validator="$(find clap-validator -type f -name clap-validator | head -n 1)"
          chmod +x "$validator"
          # param-conversions divides by zero in the validator itself for plugins without parameters.
          "$validator" validate --exclude '^param-conversions$' \
            "$VISONA_ARTEFACTS/CLAP/Visona.clap" "$SYNC_ARTEFACTS/CLAP/Visona Sync.clap"

      - name: Package plugins
        run: |
          mkdir -p dist
          if [[ "$BUILD_VST3" == true ]]; then
            tar czf dist/Visona-vst3-linux-x86_64.tar.gz -C "$VISONA_ARTEFACTS/VST3" Visona.vst3
            tar czf dist/Visona-sync-vst3-linux-x86_64.tar.gz -C "$SYNC_ARTEFACTS/VST3" "Visona Sync.vst3"
          fi
          if [[ "$BUILD_CLAP" == true ]]; then
            tar czf dist/Visona-clap-linux-x86_64.tar.gz -C "$VISONA_ARTEFACTS/CLAP" Visona.clap
            tar czf dist/Visona-sync-clap-linux-x86_64.tar.gz -C "$SYNC_ARTEFACTS/CLAP" "Visona Sync.clap"
          fi

      - name: Publish
        uses: ./.github/actions/publish

  windows-x64-plugins:
    name: Windows x64 plugins
    if: github.event_name == 'release' || inputs.windows_vst3 || inputs.windows_clap
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      VISONA_ARTEFACTS: build/windows-plugin/plugin/VisonaPlugin_artefacts/Release
      SYNC_ARTEFACTS: build/windows-plugin/plugin/VisonaSyncPlugin_artefacts/Release
      CLAP_VALIDATOR_URL: https://github.com/free-audio/clap-validator/releases/download/0.4.1/clap-validator-0.4.1-127-g152b982-windows.zip
      PLUGINVAL_URL: https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip
      BUILD_VST3: ${{ github.event_name == 'release' || inputs.windows_vst3 }}
      BUILD_CLAP: ${{ github.event_name == 'release' || inputs.windows_clap }}
    steps:
      - uses: actions/checkout@v7

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake --preset windows-plugin

      - name: Build
        run: |
          $targets = @('visona_core_tests')
          if ($env:BUILD_VST3 -eq 'true') { $targets += 'VisonaPlugin_VST3', 'VisonaSyncPlugin_VST3' }
          if ($env:BUILD_CLAP -eq 'true') { $targets += 'VisonaPlugin_CLAP', 'VisonaSyncPlugin_CLAP' }
          cmake --build --preset windows-plugin --target @targets

      - name: Test
        run: ctest --preset windows-plugin

      - name: Validate VST3 plugins
        if: env.BUILD_VST3 == 'true'
        shell: bash
        run: |
          curl -fsSL -o pluginval.zip "$PLUGINVAL_URL"
          unzip -q pluginval.zip -d pluginval
          for bundle in "$VISONA_ARTEFACTS/VST3/Visona.vst3" "$SYNC_ARTEFACTS/VST3/Visona Sync.vst3"; do
            pluginval/pluginval.exe --strictness-level 5 --skip-gui-tests --validate-in-process --validate "$bundle"
          done

      - name: Validate CLAP plugins
        if: env.BUILD_CLAP == 'true'
        shell: bash
        run: |
          curl -fsSL -o clap-validator.zip "$CLAP_VALIDATOR_URL"
          unzip -q clap-validator.zip -d clap-validator
          validator="$(find clap-validator -type f -name clap-validator.exe | head -n 1)"
          test -n "$validator"
          # param-conversions divides by zero in the validator itself for plugins without parameters.
          "$validator" validate --exclude '^param-conversions$' \
            "$VISONA_ARTEFACTS/CLAP/Visona.clap" "$SYNC_ARTEFACTS/CLAP/Visona Sync.clap"

      - name: Package plugins
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          if ($env:BUILD_VST3 -eq 'true') {
            Compress-Archive -Path "$env:VISONA_ARTEFACTS/VST3/Visona.vst3" -DestinationPath dist/Visona-vst3-windows-x64.zip
            Compress-Archive -Path "$env:SYNC_ARTEFACTS/VST3/Visona Sync.vst3" -DestinationPath dist/Visona-sync-vst3-windows-x64.zip
          }
          if ($env:BUILD_CLAP -eq 'true') {
            Compress-Archive -Path "$env:VISONA_ARTEFACTS/CLAP/Visona.clap" -DestinationPath dist/Visona-clap-windows-x64.zip
            Compress-Archive -Path "$env:SYNC_ARTEFACTS/CLAP/Visona Sync.clap" -DestinationPath dist/Visona-sync-clap-windows-x64.zip
          }

      - name: Publish
        uses: ./.github/actions/publish

  linux-arm64:
    name: Linux arm64 app (Pi)
    if: github.event_name == 'release' || inputs.pi_app
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            libasound2-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxcomposite-dev libxi-dev libgl1-mesa-dev libegl-dev

      - name: Configure
        run: cmake --preset pi-ci

      - name: Build
        run: cmake --build --preset pi-ci

      - name: Test
        run: ctest --preset pi-ci

      - name: Package Pi binary and kiosk scripts
        run: |
          mkdir -p dist
          tar czf dist/Visona-linux-arm64-pi.tar.gz \
            -C build/pi-ci/app/Visona_artefacts/Release Visona \
            -C "$GITHUB_WORKSPACE" scripts/pi docs/pi-kiosk.md docs/pi-build.md docs/pi-setup.md

      - name: Publish
        uses: ./.github/actions/publish
