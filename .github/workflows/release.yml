name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: [cursor/au-clap-plugins-7a59]

permissions:
  contents: write

jobs:
  macos:
    name: macOS arm64 app and plugins
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      APP_BUNDLE: build/macos/app/Visona_artefacts/Release/Visona.app
      VISONA_ARTEFACTS: build/macos/plugin/VisonaPlugin_artefacts/Release
      SYNC_ARTEFACTS: build/macos/plugin/VisonaSyncPlugin_artefacts/Release
      CLAP_VALIDATOR_URL: https://github.com/free-audio/clap-validator/releases/download/0.4.1/clap-validator-0.4.1-127-g152b982-macos-15-aarch64.zip
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake --preset macos

      - name: Build
        run: cmake --build --preset macos

      - name: Test
        run: ctest --preset macos

      - name: Check app bundle
        run: |
          executable="$APP_BUNDLE/Contents/MacOS/Visona"
          test "$(lipo -archs "$executable")" = "arm64"
          vtool -show-build "$executable" | grep -E '^ +minos 14\.0$'
          codesign --verify --strict --verbose=2 "$APP_BUNDLE"
          plist="$APP_BUNDLE/Contents/Info.plist"
          test "$(plutil -extract CFBundleIdentifier raw "$plist")" = "io.github.stephanterning.visona"
          plutil -extract NSMicrophoneUsageDescription raw "$plist"

      - name: Package app
        run: ditto -c -k --keepParent "$APP_BUNDLE" Visona-macos-arm64.zip

      - name: Sign plugin bundles
        run: |
          for bundle in \
              "$VISONA_ARTEFACTS/VST3/Visona.vst3" "$SYNC_ARTEFACTS/VST3/Visona Sync.vst3" \
              "$VISONA_ARTEFACTS/AU/Visona.component" "$SYNC_ARTEFACTS/AU/Visona Sync.component" \
              "$VISONA_ARTEFACTS/CLAP/Visona.clap" "$SYNC_ARTEFACTS/CLAP/Visona Sync.clap"; do
            test -d "$bundle"
            test "$(lipo -archs "$bundle/Contents/MacOS/$(basename "${bundle%.*}")")" = "arm64"
            codesign --force --sign - --timestamp=none --deep "$bundle"
            codesign --verify --strict --verbose=2 "$bundle"
          done

      - name: Validate AU plugins
        run: |
          components="$HOME/Library/Audio/Plug-Ins/Components"
          mkdir -p "$components"
          rm -rf "$components/Visona.component" "$components/Visona Sync.component"
          cp -R "$VISONA_ARTEFACTS/AU/Visona.component" "$SYNC_ARTEFACTS/AU/Visona Sync.component" "$components/"
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -a | grep -E 'Ster'
          auval -strict -v aufx Visn Ster
          auval -strict -v aumu Sync Ster

      - name: Validate CLAP plugins
        run: |
          curl -fsSL -o clap-validator.zip "$CLAP_VALIDATOR_URL"
          mkdir clap-validator
          ditto -x -k clap-validator.zip clap-validator
          find clap-validator -name '*.tar.gz' -exec tar -xzf {} -C clap-validator \;
          validator="$(find clap-validator -type f -name clap-validator -perm -u+x | head -n 1)"
          test -n "$validator"
          # param-conversions divides by zero in the validator itself for plugins without parameters.
          "$validator" validate --exclude '^param-conversions$' \
            "$VISONA_ARTEFACTS/CLAP/Visona.clap" "$SYNC_ARTEFACTS/CLAP/Visona Sync.clap"

      - name: Package plugins
        run: |
          ditto -c -k --keepParent "$VISONA_ARTEFACTS/VST3/Visona.vst3" Visona-vst3-macos-arm64.zip
          ditto -c -k --keepParent "$SYNC_ARTEFACTS/VST3/Visona Sync.vst3" Visona-sync-vst3-macos-arm64.zip
          ditto -c -k --keepParent "$VISONA_ARTEFACTS/AU/Visona.component" Visona-au-macos-arm64.zip
          ditto -c -k --keepParent "$SYNC_ARTEFACTS/AU/Visona Sync.component" Visona-sync-au-macos-arm64.zip
          ditto -c -k --keepParent "$VISONA_ARTEFACTS/CLAP/Visona.clap" Visona-clap-macos-arm64.zip
          ditto -c -k --keepParent "$SYNC_ARTEFACTS/CLAP/Visona Sync.clap" Visona-sync-clap-macos-arm64.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: Visona-macos-arm64
          path: Visona-macos-arm64.zip
          if-no-files-found: error
          retention-days: 90

      - name: Upload macOS VST3 artifact
        uses: actions/upload-artifact@v7
        with:
          name: Visona-vst3-macos-arm64
          path: Visona-vst3-macos-arm64.zip
          if-no-files-found: error
          retention-days: 90

      - name: Upload macOS Visona Sync VST3 artifact
        uses: actions/upload-artifact@v7
        with:
          name: Visona-sync-vst3-macos-arm64
          path: Visona-sync-vst3-macos-arm64.zip
          if-no-files-found: error
          retention-days: 90

      - name: Upload macOS AU artifact
        uses: actions/upload-artifact@v7
        with:
          name: Visona-au-macos-arm64
          path: Visona-au-macos-arm64.zip
          if-no-files-found: error
          retention-days: 90

      - name: Upload macOS Visona Sync AU artifact
        uses: actions/upload-artifact@v7
        with:
          name: Visona-sync-au-macos-arm64
          path: Visona-sync-au-macos-arm64.zip
          if-no-files-found: error
          retention-days: 90

      - name: Upload macOS CLAP artifact
        uses: actions/upload-artifact@v7
        with:
          name: Visona-clap-macos-arm64
          path: Visona-clap-macos-arm64.zip
          if-no-files-found: error
          retention-days: 90

      - name: Upload macOS Visona Sync CLAP artifact
        uses: actions/upload-artifact@v7
        with:
          name: Visona-sync-clap-macos-arm64
          path: Visona-sync-clap-macos-arm64.zip
          if-no-files-found: error
          retention-days: 90

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Visona-macos-arm64.zip
            Visona-vst3-macos-arm64.zip
            Visona-sync-vst3-macos-arm64.zip
            Visona-au-macos-arm64.zip
            Visona-sync-au-macos-arm64.zip
            Visona-clap-macos-arm64.zip
            Visona-sync-clap-macos-arm64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux-arm64:
    name: Linux arm64 app (Pi)
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            libasound2-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxcomposite-dev libxi-dev libgl1-mesa-dev

      - name: Configure
        run: cmake --preset pi

      - name: Build
        run: cmake --build --preset pi

      - name: Test
        run: ctest --preset pi

      - name: Package Pi binary and kiosk scripts
        run: |
          tar czf Visona-linux-arm64-pi.tar.gz \
            -C build/pi/app/Visona_artefacts/Release Visona \
            -C "$GITHUB_WORKSPACE" scripts/pi docs/pi-kiosk.md docs/pi-build.md docs/pi-setup.md

      - name: Upload Pi artifact
        uses: actions/upload-artifact@v7
        with:
          name: Visona-linux-arm64-pi
          path: Visona-linux-arm64-pi.tar.gz
          if-no-files-found: error
          retention-days: 90

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: Visona-linux-arm64-pi.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
